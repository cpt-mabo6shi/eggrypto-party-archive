<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f5f8"><title>エグリプト 編成保管ツール | cpt.ツールズ</title><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png"><link rel="icon" type="image/png" href="./icon-512.png"><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="編成保管"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color-scheme:light;background:#f4f5f8;color:#222}*{box-sizing:border-box}body{margin:0;background:#f4f5f8}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.wrap{max-width:740px;margin:auto;padding:18px 14px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:1.35rem;margin:5px 0}small,.muted{color:#666}.panel{background:#fff;border:1px solid #d9d9dc;border-radius:14px;padding:14px;margin-top:14px;box-shadow:0 2px 9px #1b27330a}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar>*{flex:1}button,.btn{border:1px solid #b8b8bd;border-radius:10px;background:#fff;color:#1976df;padding:11px 13px;min-height:43px;text-align:center;font-weight:600}.primary{background:#1684ed;border-color:#1684ed;color:#fff;font-weight:700}.danger{background:#fff;border-color:#e4a4b0;color:#b00030}.sub{background:#fff;color:#1976df}.count{white-space:nowrap;font-size:.88rem;color:#666}input[type=text],textarea{width:100%;background:#fff;border:1px solid #b8b8bd;color:#222;border-radius:10px;padding:12px;outline-offset:2px}textarea{min-height:95px;resize:vertical}label{display:block;margin:14px 0 6px;font-weight:600}input[type=file]{width:100%;font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.item{background:#fff;border:1px solid #d9d9dc;border-radius:13px;overflow:hidden;box-shadow:0 2px 8px #1b27330a}.thumb{width:100%;aspect-ratio:1.35;object-fit:contain;background:#f0f1f3;display:block}.info{padding:11px}.name{font-weight:700;overflow-wrap:anywhere}.note{font-size:.82rem;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:5px 0 10px}.item button{width:100%;padding:8px}.empty{text-align:center;color:#666;padding:35px 12px}.preview{width:100%;max-height:330px;object-fit:contain;background:#f0f1f3;border-radius:10px;margin-top:12px}.hidden{display:none!important}dialog{background:#fff;color:#222;border:1px solid #d9d9dc;border-radius:16px;width:min(94vw,650px);max-height:90dvh;overflow:auto;padding:18px}dialog::backdrop{background:#0009}dialog img{width:100%;object-fit:contain;max-height:65dvh;background:#f0f1f3;border-radius:10px}dialog h2{overflow-wrap:anywhere;font-size:1.15rem}dialog p{white-space:pre-wrap;overflow-wrap:anywhere}footer{text-align:center;margin-top:30px;color:#666;font-size:.82rem}.help{font-size:.82rem;color:#666;line-height:1.6}#status{min-height:20px;font-size:.85rem;margin-top:8px;color:#176fba}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:350px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header><div><h1>エグリプト 編成保管ツール</h1></div><span id="count" class="count">0 / 50 編成</span></header><section class="panel"><div class="bar"><button id="addBtn" class="primary">＋ 新しい編成を登録</button><button id="exportBtn" class="sub">バックアップ</button><button id="importBtn" class="sub">復元</button></div><input id="importFile" type="file" accept="application/json,.json" class="hidden"><div id="status" role="status" aria-live="polite"></div><p class="help">データはこの端末のブラウザ内に保存されます。Safariのデータ削除や端末変更に備え、定期的にバックアップしてください。</p></section><section class="panel"><input id="search" type="text" placeholder="編成名・メモで検索" aria-label="編成を検索"><div id="grid" class="grid"></div><div id="empty" class="empty">まだ編成がありません。<br>「新しい編成を登録」から始めてください。</div></section><footer>cpt.ツールズ | EGGRYPTO Party Archive ver.0.6</footer></main>
<dialog id="editor"><form id="form"><h2 id="formTitle">編成を登録</h2><label for="name">編成名（必須）</label><input id="name" type="text" maxlength="100" required placeholder="例：ツクヨミ EX 安定攻略"><label for="memo">攻略メモ（任意）</label><textarea id="memo" maxlength="3000" placeholder="注意点や立ち回りなど"></textarea><label for="photo">編成スクリーンショット <span id="photoRequired">（必須）</span></label><input id="photo" type="file" accept="image/*"><img id="editPreview" class="preview hidden" alt="選択した編成画像"><p class="help">画像は文字の見やすさを優先して必要に応じて圧縮します。保存は最大50件です。</p><div class="bar"><button type="button" id="cancelEdit">キャンセル</button><button type="submit" class="primary" id="saveBtn">保存する</button></div></form></dialog>
<dialog id="viewer"><h2 id="viewName"></h2><img id="viewImage" alt="保存した編成スクリーンショット"><p id="viewMemo"></p><div class="bar"><button id="closeView">閉じる</button><button id="editView" class="primary">編集</button><button id="deleteView" class="danger">削除</button></div></dialog>
<script>
'use strict';const MAX=50,DB='cpt-eggrypto-party-archive',STORE='parties';let db,items=[],editing=null,viewing=null,pending=null;const $=id=>document.getElementById(id);const say=s=>{$('status').textContent=s};
function openDb(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function tx(mode,fn){return new Promise((resolve,reject)=>{let t=db.transaction(STORE,mode),s=t.objectStore(STORE),result;t.oncomplete=()=>resolve(result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||new Error('保存失敗'));try{result=fn(s)}catch(e){t.abort();reject(e)}})}
function all(){return new Promise((resolve,reject)=>{let t=db.transaction(STORE,'readonly'),r=t.objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function refresh(){items=(await all()).sort((a,b)=>b.updated-a.updated);render()}
function render(){let q=$('search').value.trim().toLocaleLowerCase(),filtered=items.filter(x=>(x.name+' '+x.memo).toLocaleLowerCase().includes(q));$('count').textContent=`${items.length} / ${MAX} 編成`;$('addBtn').disabled=items.length>=MAX;let grid=$('grid');grid.replaceChildren();for(let item of filtered){let article=document.createElement('article');article.className='item';let img=document.createElement('img');img.className='thumb';img.src=item.image;img.alt=item.name;img.loading='lazy';let info=document.createElement('div');info.className='info';let name=document.createElement('div');name.className='name';name.textContent=item.name;let note=document.createElement('div');note.className='note';note.textContent=item.memo||'メモなし';let btn=document.createElement('button');btn.textContent='詳細を見る';btn.onclick=()=>show(item.id);info.append(name,note,btn);article.append(img,info);grid.append(article)}$('empty').classList.toggle('hidden',filtered.length>0);$('empty').innerHTML=items.length?(q?'該当する編成はありません。':'編成がありません。'):'まだ編成がありません。<br>「新しい編成を登録」から始めてください。'}
function edit(id=null){editing=id;pending=null;$('form').reset();let item=items.find(x=>x.id===id);$('formTitle').textContent=item?'編成を編集':'編成を登録';$('name').value=item?.name||'';$('memo').value=item?.memo||'';$('photoRequired').textContent=item?'（変更時のみ選択）':'（必須）';$('editPreview').classList.toggle('hidden',!item);if(item)$('editPreview').src=item.image;else $('editPreview').removeAttribute('src');$('viewer').close();$('editor').showModal()}
function show(id){viewing=id;let x=items.find(v=>v.id===id);if(!x)return;$('viewName').textContent=x.name;$('viewImage').src=x.image;$('viewMemo').textContent=x.memo||'メモなし';$('viewer').showModal()}
function readAsDataURL(blob){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function imageFromFile(file){return new Promise((res,rej)=>{let url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);res(img)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('画像を読み込めません'))};img.src=url})}
async function compress(file){if(!file.type.startsWith('image/'))throw Error('画像ファイルを選択してください');if(file.size>30*1024*1024)throw Error('30MB以下の画像を選択してください');let img=await imageFromFile(file),scale=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let blob=await new Promise(res=>canvas.toBlob(res,'image/webp',.88));if(!blob)throw Error('画像変換に失敗しました');return readAsDataURL(blob)}
$('addBtn').onclick=()=>edit();$('cancelEdit').onclick=()=>$('editor').close();$('closeView').onclick=()=>$('viewer').close();$('editView').onclick=()=>edit(viewing);$('search').oninput=render;
$('photo').onchange=async()=>{let file=$('photo').files[0];if(!file)return;try{say('画像を処理しています…');pending=await compress(file);$('editPreview').src=pending;$('editPreview').classList.remove('hidden');say('画像の準備ができました')}catch(e){pending=null;$('photo').value='';alert(e.message);say('')}};
$('form').onsubmit=async e=>{e.preventDefault();let btn=$('saveBtn');btn.disabled=true;try{let original=items.find(x=>x.id===editing);if(!original&&items.length>=MAX)throw Error('50編成まで保存できます');let image=pending||original?.image;if(!image)throw Error('スクリーンショットを選択してください');let record={id:original?.id||crypto.randomUUID(),name:$('name').value.trim(),memo:$('memo').value.trim(),image,created:original?.created||Date.now(),updated:Date.now()};if(!record.name)throw Error('編成名を入力してください');await tx('readwrite',s=>s.put(record));$('editor').close();await refresh();say('保存しました')}catch(err){alert('保存できませんでした：'+err.message)}finally{btn.disabled=false}};
$('deleteView').onclick=async()=>{let x=items.find(v=>v.id===viewing);if(!x||!confirm(`「${x.name}」を削除しますか？`))return;try{await tx('readwrite',s=>s.delete(viewing));$('viewer').close();await refresh();say('削除しました')}catch(e){alert('削除できませんでした：'+e.message)}};
$('exportBtn').onclick=async()=>{try{let payload={app:'cpt-eggrypto-party-archive',version:1,exported:new Date().toISOString(),items:await all()},blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='eggrypto-hensei-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);say('バックアップファイルを書き出しました。ファイルアプリなどに保管してください')}catch(e){alert('バックアップに失敗しました：'+e.message)}};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async()=>{let file=$('importFile').files[0];if(!file)return;try{if(file.size>80*1024*1024)throw Error('バックアップファイルが大きすぎます');let data=JSON.parse(await file.text());if(data.app!=='cpt-eggrypto-party-archive'||data.version!==1||!Array.isArray(data.items)||data.items.length>MAX||data.items.some(x=>!x||typeof x.id!=='string'||typeof x.name!=='string'||typeof x.memo!=='string'||typeof x.image!=='string'||!/^data:image\/(webp|png|jpeg);base64,/.test(x.image)))throw Error('対応するバックアップファイルではありません');if(new Set(data.items.map(x=>x.id)).size!==data.items.length)throw Error('重複したデータがあります');if(!confirm(`バックアップの${data.items.length}編成で現在の${items.length}編成を置き換えます。よろしいですか？`))return;await tx('readwrite',s=>{s.clear();for(let x of data.items)s.put(x)});await refresh();say(`${items.length}編成を復元しました`)}catch(e){alert('復元できませんでした：'+e.message)}finally{$('importFile').value=''}};
(async()=>{try{db=await openDb();await refresh()}catch(e){say('端末内の保存領域を利用できません。Safariの通常モードで開いてください。');$('addBtn').disabled=true;$('importBtn').disabled=true;$('exportBtn').disabled=true}})();
</script></body></html>
